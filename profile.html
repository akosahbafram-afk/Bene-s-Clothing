<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FashionVault – Profile</title>
  <link rel="stylesheet" href="profile.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="navbar profile-nav">
    <a href="index.html" class="nav-back" aria-label="Back to Home">← Home</a>
    <div class="nav-title">Profile</div>
  </nav>

  <section class="profile-card">
    <div class="profile-avatar">
      <img src="IMAGES/download (39).jpeg" alt="Profile photo" />
    </div>
    <div class="profile-info">
      <h1>Anna Fashion</h1>
      <p class="profile-role">Style Curator</p>
      <div class="profile-stats">
        <div>
          <span>24</span>
          <small>Orders</small>
        </div>
        <div>
          <span>183</span>
          <small>Favorites</small>
        </div>
        <div>
          <span>5</span>
          <small>Reviews</small>
        </div>
      </div>
    </div>
  </section>

  <section class="profile-actions">
    <a href="#" class="profile-action">Edit Profile</a>
    <a href="#" class="profile-action">Payment Methods</a>
    <a href="#" class="profile-action">Order History</a>
    <a href="#" class="profile-action logout">Log Out</a>
  </section>

  <script src="profile.js"></script>
</body>
</html>
