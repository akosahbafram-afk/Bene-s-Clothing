<!DOCTYPE html>
<html lang="en">
<head>

<!-- NAVBAR -->
<nav class="nav">

    <div class="nav-left">
        <a href="index.html"><i class="fa-solid fa-arrow-left"></i></a>
    </div>

    <div class="nav-right">
        <i class="fa-regular fa-heart"></i>
        <i class="fa-solid fa-share"></i>
    </div>

 <div class="nav-right">

        <i class="fa-solid fa-filter"></i>

<!-- PRODUCT IMAGE -->
<section class="product-image">
    <img src="IMAGES/WhatsApp Image 2026-04-07 at 16.30.19 (1).jpeg" class="main-img">
</section>

<!-- DETAILS -->
<section class="product-details">

    <h2>Men's Suit</h2>

    <div class="rating">
        <span>⭐⭐⭐⭐☆</span>
        <span>4.8</span>
    </div>

</section>

<!-- SIZE -->
<section class="sizes">

    <div class="size-options">
        <button>S</button>
        <button>M</button>
        <button>L</button>
        <button>XL</button>
    </div>
</section>

<!-- QUANTITY -->
<section class="quantity">
    <h4>Quantity</h4>

    <div class="qty-box">
        <button>-</button>
        <span>1</span>
        <button>+</button>
    </div>
</section>

<!-- DESCRIPTION -->
<section class="description">
    <h4>Description</h4>
    <p>
        Elegant blueblack men's suit, perfect for business and formal events.
        Made from high-quality fabrics for a refinrd look.
    </p>
</section>

<!-- FEATURES -->
<section class="features">
    <ul>
        <li>✔ High Quality Fabric</li>
        <li>✔ Fast Delivery</li>
    </ul>
</section>

<!-- ACTIONS -->
<section class="actions">
    <button>Buy Now</button>
    <button>0530211911</button>
</section>

<!-- EXTRA IMAGES -->
<section class="extra-images">
    <img src="IMAGES/WhatsApp Image 2026-04-07 at 16.30.18 (2).jpeg">
